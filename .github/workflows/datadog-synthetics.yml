# Datadog Synthetic tests workflow
name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for Datadog credentials
      id: check_keys
      run: |
        if [ -n "${{ secrets.DD_API_KEY }}" ] && [ -n "${{ secrets.DD_APP_KEY }}" ]; then
          echo "has_keys=true" >> $GITHUB_OUTPUT
        else
          echo "has_keys=false" >> $GITHUB_OUTPUT
          echo "Notice: DD_API_KEY or DD_APP_KEY secrets are not configured in repository secrets. Skipping Datadog Synthetic tests gracefully."
        fi

    - name: Run Datadog Synthetic tests
      if: steps.check_keys.outputs.has_keys == 'true'
      uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
      with:
        api_key: ${{ secrets.DD_API_KEY }}
        app_key: ${{ secrets.DD_APP_KEY }}
        test_search_query: 'tag:e2e-tests'
