name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1)
          echo "Raw Java version string: $JAVA_VER_STRING"

          JAVA_MAJOR=$(echo "$JAVA_VER_STRING" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not detect active Java major version."
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java version verification passed ($JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Debug Keystore Setup ==="
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Debug APK Verification ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            echo "Scanning app/build/outputs/apk for available APK files..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -type f
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac

          echo "Verified: $EXPECTED_APK exists, is a regular file, non-empty, and valid."
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          cp app/build/outputs/apk/debug/app-debug.apk "$TMP_DIR/app-debug.apk"
          if [ ! -s "$TMP_DIR/app-debug.apk" ]; then
            echo "ERROR: Failed to copy app-debug.apk to release staging directory."
            exit 1
          fi
          echo "asset_dir=$TMP_DIR" >> "$GITHUB_OUTPUT"
          echo "asset_path=$TMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $TMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub Release Publishing ==="
          gh --version
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI (gh) is not available."
            exit 1
          fi

          RELEASE_ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ]; then
            echo "ERROR: Release asset does not exist or is empty: $RELEASE_ASSET"
            exit 1
          fi

          FILENAME=$(basename "$RELEASE_ASSET")
          if [ "$FILENAME" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be app-debug.apk, got: $FILENAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > /tmp/release_notes.md
          ### Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${{ github.run_number }}
          - **Workflow Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** `${{ github.sha }}`
          - **Build Type:** Debug APK (`app-debug.apk`)
          - **Signing:** Temporary debug keystore

          > **Note:** This APK is intended for testing and verification only. It is not a production release.
          EOF

          gh release create "$RELEASE_TAG" \
            "$RELEASE_ASSET#app-debug.apk" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Release Summary ==="
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "GitHub Release creation SUCCEEDED."
            gh release view "$RELEASE_TAG" || true
            echo "Release tag: $RELEASE_TAG"
            echo "Release title: Debug APK Build #${{ github.run_number }}"
            echo "Asset filename: app-debug.apk"
            echo "Direct download URL: $DIRECT_URL"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "The latest debug APK is ready for download:"
              echo ""
              echo "[Download app-debug.apk]($DIRECT_URL)"
              echo ""
              echo "\`$DIRECT_URL\`"
              echo ""
              echo "> **Backup Artifact:** The standard GitHub Actions artifact \`app-debug-apk\` remains preserved and available in the Actions summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and artifact 'app-debug-apk' was uploaded to Actions."
              {
                echo "## APK Build Completed (Release Note)"
                echo ""
                echo "The APK build succeeded and is available as the GitHub Actions backup artifact: \`app-debug-apk\`."
                echo ""
                echo "> GitHub Release publishing could not be completed, but the Actions artifact is preserved."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "ERROR: APK build failed."
            fi
          fi
